name: Test

on:
  workflow_dispatch:
    inputs:
      performanceTesting:
        description: 'Run Performance Tests:'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      runSpecific:
        description: 'Do you want to run specific test cases or all?'
        required: false
        type: choice
        default: 'specific'
        options: 
          - 'all'
          - 'specific'
      specificTestCases:
        description: 'Enter specific test case IDs separated by commas (only used if "specific" is selected above)'
        required: false
jobs:
  Build_testcases_parameter:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.performanceTesting == 'true' && github.event.inputs.runSpecific == 'specific'}}
    name: Build parameter
    outputs:
      testIDs: ${{ steps.set_test_ids.outputs.testIDs }}
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v2.3.4
      - name: 'Determine Test IDs'
        id: set_test_ids
        run: |
          test_case_string="${{ github.event.inputs.specificTestCases }}"
          # Replace commas with JSON array format
          json_array=$(echo "$test_case_string" | sed 's/,/,/g' | sed 's/^/[ /; s/$/ ]/')
          echo "Formatted JSON array: $json_array" # Debugging output
          echo "testIDs=$clean_test_case_array" >> "$GITHUB_OUTPUT"
  print_test_ids:
    name: Print Test IDs
    runs-on: ubuntu-latest
    needs: Build_testcases_parameter
    steps:
      - name: Print Test IDs
        run: |
          echo "Test IDs from the previous job:"
          echo "${{ fromJson(needs.Build_testcases_parameter.outputs.testIDs) }}"
  performance_testing_specific:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.performanceTesting == 'true' && github.event.inputs.runSpecific == 'specific'}}
    name: Specific
    runs-on: ubuntu-latest
    needs: Build_testcases_parameter
    strategy:
      max-parallel: 1 # Ensures tests run sequentially
      matrix:
        testID:${{ fromJson(needs.Build_testcases_parameter.outputs.testIDs) }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v2.3.4         
      - name: Wait before starting test
        run: sleep 5 

  performance_testing_all:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.performanceTesting == 'true' && github.event.inputs.runSpecific == 'all'}}  
    name: All
    runs-on: ubuntu-latest
    strategy:
      matrix:
        testID: [1,2,3]
      max-parallel: 1  # Still use this to attempt sequential execution
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v2.3.4
      
      - name: Wait before starting test
        run: sleep 10 
